<nav class="w-full bg-gray-900 text-white px-6 py-3 flex items-center justify-between shadow-md">
  <div class="text-lg font-bold tracking-wide text-blue-400">
    Buraq AI
  </div>
  <div class="flex items-center gap-6">

    <!-- Dashboard link - visible for all authenticated users -->
    <a
      routerLink="/dashboard"
      routerLinkActive="text-white border-b border-blue-400"
      class="text-sm text-gray-300 hover:text-white transition duration-200">
      Assistant
    </a>


        <!-- My Tickets - visible for all authenticated users -->
    <a
      routerLink="/tickets"
      routerLinkActive="text-white border-b border-blue-400"
      class="text-sm text-gray-300 hover:text-white transition duration-200">
      My Tickets
    </a>

        <!-- Assigned Tickets - visible for Support Agent and System Admin -->
    <ng-container *ngIf="authService.getUserRole() === 'ROLE_SUPPORT_AGENT' || authService.getUserRole() === 'ROLE_SYSTEM_ADMIN'">
      <a
        routerLink="/agent/tickets"
        routerLinkActive="text-white border-b border-blue-400"
        class="text-sm text-gray-300 hover:text-white transition duration-200">
        Assigned Tickets
      </a>
    </ng-container>

        <!-- All Tickets - visible for System Admin only -->
    <ng-container *ngIf="authService.getUserRole() === 'ROLE_SYSTEM_ADMIN'">
      <a
        routerLink="/admin/tickets"
        routerLinkActive="text-white border-b border-blue-400"
        class="text-sm text-gray-300 hover:text-white transition duration-200">
        All Tickets
      </a>
    </ng-container>

        <!-- Ticket Statistics - visible for System Admin only -->
    <ng-container *ngIf="authService.getUserRole() === 'ROLE_SYSTEM_ADMIN'">
      <a
        routerLink="/dashboard/stats"
        routerLinkActive="text-white border-b border-blue-400"
        class="text-sm text-gray-300 hover:text-white transition duration-200">
        Stats
      </a>
    </ng-container>

    <!-- Documents link - visible for Admin and System Admin -->
    <ng-container *ngIf="authService.getUserRole() === 'ROLE_ADMIN' || authService.getUserRole() === 'ROLE_SYSTEM_ADMIN'">
      <a
        routerLink="/documents"
        routerLinkActive="text-white border-b border-blue-400"
        class="text-sm text-gray-300 hover:text-white transition duration-200">
        Documents
      </a>
    </ng-container>

    <!-- Users link - only visible for System Admin -->
    <ng-container *ngIf="authService.getUserRole() === 'ROLE_SYSTEM_ADMIN'">
      <a
        routerLink="/admin/users"
        routerLinkActive="text-white border-b border-blue-400"
        class="text-sm text-gray-300 hover:text-white transition duration-200">
        Users
      </a>
    </ng-container>

    <span class="text-sm text-gray-300">
      {{ authService.getUserRole() }}
    </span>

    <button
      (click)="logout()"
      class="bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-2 rounded transition duration-200">
      Logout
    </button>

  </div>
</nav>
